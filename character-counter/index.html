<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字数カウンター</title>
</head>
<body>
  <textarea id="textInput" rows="10" cols="50" placeholder="ここにテキストを入力してください..."></textarea>
  <p>文字数: <span id="charCount">0</span></p>
  <p>単語数: <span id="wordCount">0</span></p>
  <p>記号文字数: <span id="symbolCount">0</span></p>
  <p>空白文字数: <span id="spaceCount">0</span></p>
  <p>行数: <span id="lineCount">1</span></p>
  <script src="script.js"></script>
</body>
</html>
